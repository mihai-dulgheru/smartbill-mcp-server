name: Release

on:
  push:
    tags: ['v*']

# Least privilege: the job only needs to read the repo and mint an OIDC token.
# `id-token: write` is what makes `npm publish --provenance` possible - without it
# npm cannot attest that this tarball was built from this commit in this workflow.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned: tags are mutable, and this job can publish.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # Writes the .npmrc that OIDC trusted publishing relies on.
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # Assert, do not install. `npm install -g npm@latest` would pull an unpinned,
      # mutable package from the registry into a job holding id-token: write and publish
      # rights, and run it before `npm publish`. Node 24 already ships npm 12, so check
      # the floor instead and fail loudly if a runner image ever regresses.
      - name: Verify npm supports trusted publishing and provenance
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e '
            const [have] = process.argv.slice(1);
            const need = "11.5.1";
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
              return 0;
            };
            if (cmp(have, need) < 0) {
              console.error(`::error::npm ${have} is below the ${need} needed for trusted publishing`);
              process.exit(1);
            }
          ' "$NPM_VERSION"

      # A tag that disagrees with package.json publishes the wrong version under the
      # right name, which is not fixable after the fact. Fail before publishing.
      - name: Verify the tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Refuse to republish a version that already exists, with a clear message rather
      # than npm's generic failure.
      - name: Verify the version is not already published
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PKG_NAME@$PKG_VERSION is already on npm. Bump the version first."
            exit 1
          fi

      - run: npm run check

      - run: npm run build

      # The published bin must actually start and register every tool.
      - name: Smoke-test the built server
        run: |
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | SMARTBILL_EMAIL=ci@example.test SMARTBILL_TOKEN=dummy \
            SMARTBILL_V3_TOKEN=dummy SMARTBILL_CIF=RO0000000 \
            node dist/index.js 2>/dev/null \
          | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const line = s.trim().split("\n").map(JSON.parse).find((m) => m.id === 2);
                const n = line?.result?.tools?.length ?? 0;
                console.log(`registered ${n} tools`);
                if (n !== 29) { console.error("expected 29"); process.exit(1); }
              });'

      # `prepublishOnly` re-runs check + build here. That is deliberate: the gate holds
      # no matter how publish is invoked, and it costs seconds.
      #
      # Auth comes from npm Trusted Publishing over OIDC - no token, no secret. npm is
      # configured to trust mihai-dulgheru/smartbill-mcp-server via this workflow file.
      # Do not add NODE_AUTH_TOKEN here: an empty value writes a blank _authToken into
      # .npmrc and npm attempts token auth instead of falling back to OIDC.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Summarise
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`$PKG_NAME@$PKG_VERSION\`"
            echo ""
            echo "- https://www.npmjs.com/package/$PKG_NAME/v/$PKG_VERSION"
            echo "- Provenance attestation attached."
          } >> "$GITHUB_STEP_SUMMARY"
